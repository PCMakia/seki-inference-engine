services:
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    container_name: seki-vllm
    ipc: host
    command: >
      --model ${MODEL_NAME}
      --served-model-name ${MODEL_NAME}
      --host 0.0.0.0
      --port 8000
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE_PATH:-D:/data/huggingface}:/root/.cache/huggingface
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - seki-inference

  ollama:
    image: ollama/ollama:latest
    container_name: seki-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_PULL_MODELS=${OLLAMA_PULL_MODELS:-${OLLAMA_MODEL:-qwen2.5:3b}}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - tr -d '\r' < /app/Execution_scripts/ollama_docker_entrypoint.sh > /tmp/ollama_docker_entrypoint.sh && chmod +x /tmp/ollama_docker_entrypoint.sh && /bin/sh /tmp/ollama_docker_entrypoint.sh
    volumes:
      - ${OLLAMA_DATA_PATH:-D:/data/ollama-data}:/root/.ollama
      - ./Execution_scripts:/app/Execution_scripts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - seki-inference

  inference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seki-inference-engine
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - API_KEY=${API_KEY:-change-me}
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen2.5-3B-Instruct}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-nomic-embed-text}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-120}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_API_KEY=${VLLM_API_KEY:-EMPTY}
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
      vllm:
        condition: service_started
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks:
      - seki-inference

networks:
  seki-inference:
    driver: bridge
