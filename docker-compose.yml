# Low_ends_6GB — Ubuntu / RTX 1660 Ti (6 GB). Ollama only.
# vLLM is not in this compose: it OOMs Turing 6 GB.
#
#   docker compose up --build
#
# Host ports (9000s so v1 Seki can keep 8000 / 11434):
#   9000  seki-v2-inference
#   9114  seki-v2-ollama

services:
  ollama:
    image: ollama/ollama:latest
    container_name: seki-v2-ollama
    ports:
      - "${OLLAMA_HOST_PORT:-9114}:11434"
    environment:
      - OLLAMA_PULL_MODELS=${OLLAMA_PULL_MODELS:-nomic-embed-text}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - tr -d '\r' < /app/Execution_scripts/ollama_docker_entrypoint.sh > /tmp/ollama_docker_entrypoint.sh && chmod +x /tmp/ollama_docker_entrypoint.sh && /bin/sh /tmp/ollama_docker_entrypoint.sh
    volumes:
      - ${OLLAMA_DATA_PATH:-./data/ollama}:/root/.ollama
      - ./Execution_scripts:/app/Execution_scripts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - seki-inference

  inference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seki-v2-inference
    ports:
      - "${INFERENCE_HOST_PORT:-9000}:8000"
    environment:
      - API_KEY=${API_KEY:-change-me}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-nomic-embed-text}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=${OLLAMA_MODEL:-seki-qwen-3b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks:
      - seki-inference

networks:
  seki-inference:
    driver: bridge
